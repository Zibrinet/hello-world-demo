name: Android CI

on:
  push:
    branches: ["claude/session-anu0wh", "main"]
    paths: ["split/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: split
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: split-debug-apk
          path: split/app/build/outputs/apk/debug/app-debug.apk

      # Publish the APK to a rolling release so it can be installed straight
      # from a phone browser (artifacts require login + unzip; releases don't).
      - name: Publish APK to rolling release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/split-debug.apk
          gh release delete split-latest --yes --cleanup-tag || true
          gh release create split-latest /tmp/split-debug.apk \
            --title "Split (latest debug build)" \
            --notes "Debug APK from commit ${GITHUB_SHA::8}. Download split-debug.apk below and open it to install." \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: split/app/build/reports/
