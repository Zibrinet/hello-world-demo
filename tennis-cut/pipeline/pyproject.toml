[project]
name = "tennis-cut"
version = "0.1.0"
description = "Cut, score and summarise singles tennis recorded on one Android phone."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
tennis = "tennis.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tennis"]
